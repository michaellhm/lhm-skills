name: Scheduled content rebuild

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages rebuild
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK is not configured."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            "$CLOUDFLARE_DEPLOY_HOOK"
