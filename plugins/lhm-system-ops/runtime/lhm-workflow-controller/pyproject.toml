[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lhm-workflow-controller"
version = "0.1.12"
description = "Host-enforced LHM production workflow controller"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lhm-workflow = "lhm_workflow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
